<style>
:root {
  --ground: #F2F3F5;
  --surface: #FFFFFF;
  --sunk: #F6F7F9;
  --ink: #15171C;
  --muted: #5C636F;
  --line: #D9DCE2;
  --g: #4A9A5A;
  --y: #C79E26;
  --x: #7B808A;
  --blue: #2E5BE0;
  --red: #CF4236;
  --tint: rgba(46, 91, 224, .10);
  --tint-red: rgba(207, 66, 54, .12);
  --tint-y: rgba(199, 158, 38, .16);
  --tile-ink: #FFFFFF;
  --display: 'Archivo', 'Arial Black', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #111317; --surface: #1A1C21; --sunk: #15171B; --ink: #E7E9ED; --muted: #99A0AC; --line: #2D3139;
    --g: #55A864; --y: #D2AB36; --x: #5B606A; --blue: #7D9BFF; --red: #F0776B;
    --tint: rgba(125, 155, 255, .16); --tint-red: rgba(240, 119, 107, .18); --tint-y: rgba(210, 171, 54, .18);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #111317; --surface: #1A1C21; --sunk: #15171B; --ink: #E7E9ED; --muted: #99A0AC; --line: #2D3139;
  --g: #55A864; --y: #D2AB36; --x: #5B606A; --blue: #7D9BFF; --red: #F0776B;
  --tint: rgba(125, 155, 255, .16); --tint-red: rgba(240, 119, 107, .18); --tint-y: rgba(210, 171, 54, .18);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.5 var(--body); padding-inline: 16px; padding-block: 20px 40px; }
.shell { max-width: 1180px; margin: 0 auto; }

/* Logo (used on Home) */
.logo { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.logo span { width: 44px; height: 48px; display: grid; place-items: center; font: 800 24px/1 var(--display); color: var(--tile-ink); border-radius: 6px; }
.logo .gap { width: 10px; }
.logo .o { background: transparent; color: var(--ink); border: 2px solid var(--line); }

/* Home screen */
.home { display: grid; gap: 32px; justify-items: center; padding-block: 40px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; width: 100%; max-width: 760px; }
.game-card { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; padding: 22px 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-align: left; box-shadow: 0 1px 0 var(--line); }
.game-card:hover { border-color: var(--blue); transform: translateY(-1px); }
.game-card:active { transform: translateY(0); }
.g-icon { font-size: 34px; line-height: 1; }
.g-name { font: 800 19px/1.15 var(--display); letter-spacing: -.01em; }
.examiners { font: 600 14px/1 var(--body); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 8px; }
.examiners:hover { color: var(--ink); text-decoration: underline; }

/* Game screen */
.game { display: none; }
.shell[data-screen="game"] .home { display: none; }
.shell[data-screen="game"] .game { display: block; }
.game-top { display: flex; align-items: center; gap: 12px; padding-block: 6px 16px; }
.back { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; flex: none; }
.back:hover { border-color: var(--muted); }
.game-title { margin: 0; font: 800 20px/1.2 var(--display); letter-spacing: -.01em; }

/* Panels */
.panel { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .panel { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
h2 { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -.01em; text-wrap: balance; }
h3 { margin: 0; font: 700 13px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.lead { color: var(--muted); font-size: 15px; }
.concept { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.pill { font: 600 11px/1 var(--mono); padding: 5px 7px; border-radius: 4px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); white-space: nowrap; }
.pill.u3 { border-color: var(--y); background: var(--tint-y); }
.pill.u4 { border-color: var(--blue); background: var(--tint); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.big { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.big small { font: 400 15px/1.2 var(--body); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.note { font: 12px/1.55 var(--mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.warn { color: var(--red); font-weight: 700; }
.ok { color: var(--g); font-weight: 700; }

/* Controls */
.btn { font: 700 14px/1 var(--body); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 7px 10px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 700 13px/1 var(--body); padding: 9px 12px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
input[type=text], input[type=number] { font: 600 16px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); color: var(--ink); width: 11.5ch; }
input[type=number] { width: 7ch; text-transform: none; }
input.wide { width: 100%; }
textarea { width: 100%; min-height: 70px; font: 14px/1.5 var(--mono); padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); color: var(--ink); resize: vertical; }
label.lbl { font: 700 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field { display: grid; gap: 6px; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .tile:focus-visible, .chip:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Tiles */
.board { display: grid; gap: 6px; }
.trow { display: flex; gap: 6px; align-items: center; }
.tile { width: 52px; height: 52px; display: grid; place-items: center; font: 800 26px/1 var(--display); text-transform: uppercase; color: var(--tile-ink); border-radius: 5px; background: var(--x); border: 0; padding: 0; }
.tile.g { background: var(--g); } .tile.y { background: var(--y); } .tile.x { background: var(--x); }
.tile.live { cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
.tile.live:hover { filter: brightness(1.08); }
.tile.pop { animation: flip .35s ease-out both; }
@keyframes flip { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }
.tile.sm { width: 30px; height: 30px; font-size: 15px; border-radius: 3px; }
.tile.plain { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.tile.hl { background: var(--blue); color: #fff; border-color: var(--blue); }
.trow .meta { font: 12px/1.3 var(--mono); color: var(--muted); margin-left: 6px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }

/* Chips & lists */
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 600 12px/1 var(--mono); text-transform: uppercase; padding: 6px 7px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.red { border-color: var(--red); background: var(--tint-red); }
.list { display: grid; gap: 4px; }
.list button { display: flex; justify-content: space-between; gap: 10px; font: 600 13px/1.2 var(--mono); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-transform: uppercase; text-align: left; }
.list button span { text-transform: none; color: var(--muted); font-weight: 400; }
.list button[aria-pressed="true"] { border-color: var(--red); background: var(--tint-red); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 520px) { .stats.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats > div { background: var(--surface); padding: 10px 12px; display: grid; gap: 3px; align-content: start; }
.stats b { font: 800 22px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }

/* Decision tree steps */
.steps { display: grid; gap: 10px; }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; background: var(--sunk); }
.step-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: baseline; }
.step-h b { font: 800 16px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.step-h span { font: 12px/1.3 var(--mono); color: var(--muted); }
.bars { width: 100%; height: 46px; display: block; }

/* Ladder */
.ladders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .ladders { grid-template-columns: minmax(0, 1fr); } }
.ladder { display: grid; gap: 4px; justify-items: start; }
.rung { font: 11px/1.3 var(--mono); color: var(--muted); padding-left: 4px; }

.scroll { overflow-x: auto; }
svg text { font-family: var(--mono); }
.dim { color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
th { font: 700 11px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bits { font: 13px/1.7 var(--mono); word-break: break-all; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.bits i { font-style: normal; padding: 1px 2px; border-radius: 2px; }
.bits i:nth-child(odd) { background: var(--tint); }
@media (prefers-reduced-motion: reduce) { .tile.pop { animation: none; } }

/* Full-screen game layout (screens registered with full: true) */
body.full { padding: 0; }
body.full .shell { max-width: none; }
.shell[data-chrome="off"] .game-top { display: none; }
.gs { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; gap: clamp(8px, 1.6vh, 18px); padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); }
.gs-top { display: grid; grid-template-columns: auto 1fr auto auto; grid-template-areas: "back title seg how"; align-items: center; gap: 10px; }
.gs-top .back-btn { grid-area: back; justify-self: start; }
.gs-title { grid-area: title; margin: 0; font: 800 clamp(18px, 2.4vw, 28px)/1.1 var(--display); letter-spacing: -.01em; text-align: center; }
.gs-top .seg { grid-area: seg; }
.gs-top .how-icon { grid-area: how; justify-self: end; }
@media (max-width: 680px) {
  .gs-top { grid-template-columns: auto 1fr auto; grid-template-areas: "back title how" "seg seg seg"; row-gap: 10px; }
  .gs-top .seg { justify-self: center; }
}
.gs-main { display: grid; gap: clamp(10px, 2.4vh, 26px); justify-items: center; align-content: center; }
.hint { color: var(--muted); font-size: clamp(14px, 1.5vw, 18px); text-align: center; min-height: 1.4em; }
.gs-bottom { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
.icon-btn { width: 46px; height: 46px; display: grid; place-items: center; font: 400 20px/1 var(--body); border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; flex: none; }
.icon-btn:hover { border-color: var(--muted); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.big-btn { font: 800 clamp(17px, 1.9vw, 21px)/1 var(--display); padding: 17px 48px; border-radius: 12px; border: 0; background: var(--ink); color: var(--surface); cursor: pointer; }
.big-btn:hover:not(:disabled) { filter: brightness(1.15); }
.big-btn:disabled { opacity: .35; cursor: default; }
.seg.tiny button { font: 700 12px/1 var(--body); padding: 8px 10px; }
input.word-in { font: 700 clamp(18px, 2.2vw, 24px)/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; text-align: center; width: 7.5ch; padding: 15px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }

/* Wordle board */
.wboard { --tsz: clamp(38px, min(8.2vh, 13vw), 72px); --tgap: calc(var(--tsz) * .085); display: grid; gap: var(--tgap); }
.wrow { display: grid; grid-template-columns: repeat(5, var(--tsz)); gap: var(--tgap); }
.wtile { width: var(--tsz); height: var(--tsz); display: grid; place-items: center; font: 800 calc(var(--tsz) * .46)/1 var(--display); text-transform: uppercase; color: var(--tile-ink); background: var(--x); border: 0; border-radius: calc(var(--tsz) * .08); padding: 0; }
.wtile.g { background: var(--g); } .wtile.y { background: var(--y); } .wtile.x { background: var(--x); }
.wtile.empty { background: transparent; border: 2px solid var(--line); }
.wtile.live { cursor: pointer; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
.wtile.live:hover { filter: brightness(1.08); }
.wtile.pop { animation: flip .35s ease-out both; }
@media (prefers-reduced-motion: reduce) { .wtile.pop { animation: none; } }

/* Big counter */
.counter { font: 800 clamp(28px, min(5.4vw, 6.5vh), 56px)/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; text-align: center; }
.counter .arrow { color: var(--muted); margin-inline: .1em; }
.counter small { display: block; font: 400 clamp(12px, 1.3vw, 15px)/1.3 var(--body); color: var(--muted); letter-spacing: 0; margin-top: 6px; }

/* Friendly popup (tapping-mistake fix) */
.popup { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 16px 18px; display: grid; gap: 10px; z-index: 35; }
.popup ul { margin: 0; padding-left: 20px; font-size: 14px; display: grid; gap: 3px; }
.popup .btn { justify-self: start; }
.popup-x { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px; }

/* How-it-works sheet: a bottom sheet holding the viva maths, hidden by default on every game screen */
.how-btn { position: fixed; right: 16px; bottom: 16px; font: 700 13px/1 var(--body); padding: 11px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.12); z-index: 30; }
.how-btn:hover { border-color: var(--muted); }
.sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .25s; z-index: 40; }
.sheet-overlay.open { opacity: 1; visibility: visible; transition: opacity .25s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 82vh; margin: 0 auto; max-width: 720px; background: var(--surface); border: 1px solid var(--line); border-bottom: none; border-radius: 16px 16px 0 0; box-shadow: 0 -12px 32px rgba(0,0,0,.18); transform: translateY(100%); transition: transform .28s ease; z-index: 41; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.sheet.open { transform: translateY(0); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; padding: 16px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 20px; }
.sheet-body { display: grid; gap: 14px; padding: 4px 18px 20px; }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-overlay { transition: none; } }

/* Celebration burst on a win */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 9px; border-radius: 2px; animation: confetti-fall 1.5s ease-in forwards; }
@keyframes confetti-fall { to { transform: translateY(100vh) rotate(360deg); opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
</style>

<div class="shell" id="shell" data-screen="home">
  <section id="home" class="home"></section>
  <section id="game" class="game">
    <header class="game-top">
      <button id="back" class="back" type="button" aria-label="Back to home">←</button>
      <h1 id="game-title" class="game-title"></h1>
    </header>
    <main id="stage"></main>
  </section>
</div>

      while (rows.length < ROWS) rows.push(`<div class="wrow">${'<span class="wtile empty"></span>'.repeat(5)}</div>`);
      return `<div class="wboard">${rows.join('')}</div>`;
    }

    function counter() {
      const total = U.fmt(WG.WORDS.length), now = U.fmt(S.cands.length);
      return `<div class="counter">${S.rows.length ? `${total} <span class="arrow">→</span> ${now}` : total}
        <small>${S.solved ? 'the answer' : 'words still possible'}</small></div>`;
    }

    function popup() {
      if (!S.msg) return '';
      const body = S.fix && S.cur ? (() => {
        const byRow = {};
        S.fix.changes.forEach((c) => { (byRow[c.row] = byRow[c.row] || []).push(`${c.letter.toUpperCase()} → ${COLOUR_NAME[c.to]}`); });
        const lines = Object.keys(byRow).map((k) => `<li>Row ${+k + 1} (${S.fix.rows[k].guess.toUpperCase()}): <b>${byRow[k].join(', ')}</b></li>`).join('');
        return `<p>Looks like a tapping slip. Fix it?</p><ul>${lines}</ul>
          <button class="btn primary sm" type="button" data-act="fix">Use this fix</button>`;
      })() : '<p class="dim">Check each tile against your word and try again.</p>';
      return `<div class="popup" role="alert"><button class="popup-x" type="button" data-act="dismiss" aria-label="Dismiss">✕</button>
        <p class="warn">${U.esc(S.msg)}</p>${body}</div>`;
    }

    function hint() {
      if (S.solved) return `Solved in ${S.rows.length} guess${S.rows.length === 1 ? '' : 'es'}.`;
      if (S.msg) return '';
      return S.mode === 'think' ? 'Pick a secret word. Tap tiles to colour them.' : 'Type a word and watch it get solved.';
    }

    function bottom() {
      if (S.mode === 'think') {
        return `<button class="icon-btn" type="button" data-act="undo" aria-label="Undo last guess" title="Undo" ${S.rows.length ? '' : 'disabled'}>↶</button>
          <button class="big-btn" type="button" data-act="next" ${S.solved ? 'disabled' : ''}>Next</button>
          <button class="icon-btn" type="button" data-act="new" aria-label="New game" title="New game">⟳</button>`;
      }
      return `<input id="sv-secret" class="word-in" type="text" maxlength="5" list="wordlist" value="${U.esc(S.secret.toUpperCase())}" autocomplete="off" aria-label="Secret word">
        <button class="big-btn" type="button" data-act="solve">Solve it</button>
        <button class="icon-btn" type="button" data-act="random" aria-label="Random word" title="Random word">🎲</button>`;
    }

    /** Everything a viva needs: the concept, the tree, the numbers and the complexity. */
    function how() {
      const path = [WG.WORDS.length, ...S.rows.map((r) => r.chosen)].map(U.fmt).join(' → ');
      const steps = S.rows.map((r, k) => `<div class="step">
        <div class="step-h"><b>Guess ${k + 1} · ${r.guess}</b><span>${U.fmt(r.before)} words → ${r.groups} branches · largest ${U.fmt(r.sizes[0])}</span></div>
        ${U.bars(r.sizes, r.chosen)}
        <p class="dim" style="font-size:13px">The colours led down a branch of <b style="color:var(--blue)">${U.fmt(r.chosen)}</b> word${r.chosen === 1 ? '' : 's'}.</p></div>`).join('');
      const nextInfo = S.cur && !S.solved && S.mode === 'think'
        ? `<div class="step" style="background:var(--surface)"><div class="step-h"><b>Next question · ${S.cur.guess}</b><span>worst branch ≤ ${U.fmt(S.cur.worst)} word${S.cur.worst === 1 ? '' : 's'}</span></div>
           <p class="dim" style="font-size:13px">Chosen from all ${U.fmt(WG.WORDS.length)} words because its largest branch is the smallest possible (minimax).</p></div>` : '';
      const cands = !S.solved && S.cands.length > 1 && S.cands.length <= 60
        ? `<div><h3 style="margin-bottom:8px">Still possible</h3><div class="chips">${S.cands.map((w) => `<span class="chip">${w}</span>`).join('')}</div></div>` : '';
      const T = WG.META.tree, maxD = Math.max(...Object.values(T.dist));
      const hist = Object.keys(T.dist).sort((a, b) => a - b).map((d) => {
        const v = T.dist[d], w = Math.max(2, (v / maxD) * 100);
        return `<div style="display:grid;grid-template-columns:9ch 1fr 6ch;gap:8px;align-items:center;font:12px var(--mono)"><span>${d} guess${d === '1' ? '' : 'es'}</span><span style="height:12px;width:${w}%;background:var(--g);border-radius:2px"></span><span>${U.fmt(v)}</span></div>`;
      }).join('');
      return U.sheet(S.how, `
        ${U.pills([['Decision tree', 'III']])}
        <p>Think of any 5-letter word and keep it secret. For each guess, tap the tiles to match the colours Wordle would give, then press Next. Every guess is a node; its feedback is one of 3⁵ = 243 colour patterns, so each node can branch up to 243 ways. The answers are the leaves.</p>
        <div class="legend"><span><i style="background:var(--g)"></i>right letter, right spot</span><span><i style="background:var(--y)"></i>in the word, wrong spot</span><span><i style="background:var(--x)"></i>not in the word</span></div>
        <div><h3 style="margin-bottom:6px">Your path down the tree</h3><p style="font:600 15px var(--mono)">${path}</p></div>
        ${steps ? `<div class="steps">${steps}</div>` : `<p class="dim">Give feedback on the first guess, ${WG.META.first.toUpperCase()}, to start down the tree. Bars will show how that guess splits all ${U.fmt(WG.WORDS.length)} words.</p>`}
        ${nextInfo}${cands}
        <div style="display:grid;gap:8px">
          <h3>Whole tree, tested on every word</h3>
          <div class="stats three"><div><b>${T.height}</b><span>Tree height: most guesses ever needed</span></div><div><b>${T.average.toFixed(2)}</b><span>Average guesses</span></div><div><b>${U.fmt(T.internal)}</b><span>Question nodes in the tree</span></div></div>
          ${hist}
        </div>
        <p class="note">Choosing a guess checks every word against every remaining answer: O(W · C) pattern checks for W guesses and C candidates. The first guess (${WG.META.first.toUpperCase()}) is precomputed; later guesses are computed live.</p>`);
    }

    function render() {
      root.innerHTML = `<div class="gs">
        <header class="gs-top">
          <button class="icon-btn back-btn" type="button" data-go="" aria-label="Back to home">←</button>
          <h1 class="gs-title">Guess my word</h1>
          <div class="seg tiny" role="group" aria-label="Mode">
            <button type="button" data-mode="think" aria-pressed="${S.mode === 'think'}">You pick a word</button>
            <button type="button" data-mode="watch" aria-pressed="${S.mode === 'watch'}">Watch it solve</button>
          </div>
          <button class="icon-btn how-icon" type="button" data-act="how-open" aria-label="How it works" title="How it works">?</button>
        </header>
        <main class="gs-main">
          <p class="hint">${U.esc(hint())}</p>
          ${board()}
          ${counter()}
        </main>
        <footer class="gs-bottom">${bottom()}</footer>
        ${popup()}
        ${how()}
      </div>`;
      S.animate = false; S.flip = -1;
      if (S.won) { S.won = false; setTimeout(U.celebrate, 350); }
    }

    root.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tile]');
      if (t && S.cur) { const i = +t.dataset.tile; S.cur.tiles[i] = (S.cur.tiles[i] + 1) % 3; S.msg = ''; S.fix = null; render(); root.querySelector(`[data-tile="${i}"]`)?.focus(); return; }
      const m = e.target.closest('[data-mode]');
      if (m) { S.mode = m.dataset.mode; reset(); if (S.mode === 'watch') watch(S.secret || 'brick'); render(); return; }
      const a = e.target.closest('[data-act]'); if (!a) return;
      const act = a.dataset.act;
      if (act === 'how-open') S.how = true;
      else if (act === 'how-close') S.how = false;
      else if (act === 'dismiss') { S.msg = ''; S.fix = null; }
      else if (act === 'next' && S.cur) submit(S.cur.tiles);
      else if (act === 'fix' && S.fix) applyFix(S.fix);
      else if (act === 'undo') undo();
      else if (act === 'new') reset();
      else if (act === 'solve') {
        const v = U.clean(root.querySelector('#sv-secret').value);
        if (!WG.G.index.has(v)) { reset(); S.secret = v; S.msg = `${v.toUpperCase() || 'That'} is not in the word list.`; }
        else watch(v);
      } else if (act === 'random') watch(WG.WORDS[Math.floor(Math.random() * WG.WORDS.length)]);
      render();
    });
    root.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.id === 'sv-secret') root.querySelector('[data-act="solve"]').click();
      if (e.key === 'Escape' && S.how) { S.how = false; render(); }
    });

    reset(); render();
  }
})(self.WG = self.WG || {});
</script>
<script>
/* Tab: Word ladder (Dijkstra and BFS, Unit IV). */
(function (WG) {
  const U = WG.ui;
  WG.tabs.push({ id: 'ladder', name: 'Word ladder', unit: 'IV', mount });

  function mount(root) {
    const G = WG.G;
    const S = { a: WG.META.ladder[0], b: WG.META.ladder[1], guess: '', res: null, msg: '' };

    function run() {
      S.msg = ''; S.res = null;
      if (!G.index.has(S.a) || !G.index.has(S.b)) { S.msg = `${(!G.index.has(S.a) ? S.a : S.b).toUpperCase() || 'That'} is not in the word list.`; return; }
      if (S.a === S.b) { S.msg = 'Pick two different words.'; return; }
      const s = G.index.get(S.a), t = G.index.get(S.b);
      const bfs = WG.bfs(G, s, t), dij = WG.dijkstra(G, s, t);
      let comps = null;
      if (!bfs.path) { const c = WG.components(G.adj); comps = { a: c.sizes[c.comp[s]], b: c.sizes[c.comp[t]] }; }
      S.res = { bfs, dij, comps };
    }
    function randomPair() {
      const c = WG.components(G.adj), big = c.sizes.indexOf(Math.max(...c.sizes));
      for (let tries = 0; tries < 50; tries++) {
        const s = Math.floor(Math.random() * WG.WORDS.length);
        if (c.comp[s] !== big || G.adj[s].length < 2) continue;
        const d = WG.bfsDistances(G, s), far = [];
        d.forEach((x, i) => { if (x >= 5 && x <= 7) far.push(i); });
        if (far.length) { S.a = WG.WORDS[s]; S.b = WG.WORDS[far[Math.floor(Math.random() * far.length)]]; return; }
      }
    }
    const cost = (path) => path.slice(1).reduce((sum, v, i) => sum + WG.edgeWeight(G.words[path[i]], G.words[v]), 0);

    function ladderHTML(path) {
      return `<div class="ladder">${path.map((v, i) => {
        const w = G.words[v];
        if (i === 0) return U.word(w, 'sm');
        const prev = G.words[path[i - 1]], p = WG.diffPos(prev, w);
        return `<div class="rung">${prev[p].toUpperCase()} → ${w[p].toUpperCase()} · key distance ${WG.edgeWeight(prev, w).toFixed(2)}</div>${U.word(w, 'sm', p)}`;
      }).join('')}</div>`;
    }

    function render() {
      const r = S.res;
      let out = '';
      if (S.msg) out = `<p class="warn">${U.esc(S.msg)}</p>`;
      else if (r && !r.bfs.path) out = `<p class="warn">No ladder exists.</p><p>${S.a.toUpperCase()} is in a connected component of ${U.fmt(r.comps.a)} word${r.comps.a === 1 ? '' : 's'}, and ${S.b.toUpperCase()} is in a different component of ${U.fmt(r.comps.b)}. No path can cross between components.</p>`;
      else if (r) {
        const steps = r.bfs.path.length - 1, dSteps = r.dij.path.length - 1, same = r.bfs.path.join() === r.dij.path.join();
        const g = parseInt(S.guess, 10);
        const verdict = Number.isFinite(g) ? `<p>${g === steps ? '<span class="ok">Exactly right.</span>' : g > steps ? `<span class="ok">It's shorter than you thought:</span> ${steps} steps, not ${g}.` : `<span class="warn">Impossible:</span> the shortest ladder needs ${steps} steps.`}</p>` : '';
        out = `${verdict}
        <div class="stats three"><div><b>${steps}</b><span>Fewest steps (BFS)</span></div><div><b>${r.dij.cost.toFixed(2)}</b><span>Least typing effort (Dijkstra)</span></div><div><b>${U.fmt(r.dij.settled)}</b><span>Words settled by Dijkstra</span></div></div>
        <div class="ladders">
          <div><h3 style="margin-bottom:8px">Fewest steps · ${steps}</h3>${ladderHTML(r.bfs.path)}<p class="dim" style="font-size:13px;margin-top:6px">Effort ${cost(r.bfs.path).toFixed(2)}</p></div>
          <div><h3 style="margin-bottom:8px">Least effort · ${dSteps} steps</h3>${ladderHTML(r.dij.path)}<p class="dim" style="font-size:13px;margin-top:6px">Effort ${r.dij.cost.toFixed(2)}</p></div>
        </div>
        <p>${same ? 'Here the shortest ladder is also the easiest to type.' : `The easiest ladder to type is <b>not</b> the shortest: it takes ${dSteps - steps} extra step${dSteps - steps === 1 ? '' : 's'} but saves ${(cost(r.bfs.path) - r.dij.cost).toFixed(2)} key-widths of finger travel. That is why a weighted graph needs Dijkstra, not BFS.`}</p>`;
      }
      root.innerHTML = `<div class="card">
        <h2>Word ladder</h2>
        ${U.pills([['Dijkstra', 'IV'], ['Shortest path', 'IV']])}
        <p class="lead">Change one letter at a time; every step must be a real word. Each word is a vertex, and one-letter changes are edges.</p>
        <div class="row">
          <div class="field"><label class="lbl" for="ld-a">From</label><input id="ld-a" type="text" maxlength="5" list="wordlist" value="${S.a.toUpperCase()}" autocomplete="off"></div>
          <div class="field"><label class="lbl" for="ld-b">To</label><input id="ld-b" type="text" maxlength="5" list="wordlist" value="${S.b.toUpperCase()}" autocomplete="off"></div>
          <div class="field"><label class="lbl" for="ld-g">Your guess</label><input id="ld-g" type="number" min="1" max="30" placeholder="steps" value="${U.esc(S.guess)}"></div>
        </div>
        <div class="row"><button class="btn primary" type="button" data-act="go">Find ladders</button><button class="btn" type="button" data-act="swap">Swap</button><button class="btn" type="button" data-act="rand">Random challenge</button></div>
        <p class="dim" style="font-size:14px"><b>Edge weights:</b> the distance between the old and new letter on a QWERTY keyboard. Swapping to a neighbouring key costs 1.00; E → M costs ${WG.keyDistance('e', 'm').toFixed(2)}.</p>
        <p class="note">BFS: O(V + E), counts every edge as 1. Dijkstra with a binary heap: O((V + E) log V), handles different edge weights. Dijkstra is correct here because key distances are never negative.</p>
      </div>
      <div class="card"><h2>${S.a.toUpperCase()} → ${S.b.toUpperCase()}</h2>${out || '<p class="dim">Press Find ladders.</p>'}</div>`;
    }

    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      S.a = U.clean(root.querySelector('#ld-a').value); S.b = U.clean(root.querySelector('#ld-b').value); S.guess = root.querySelector('#ld-g').value;
      if (b.dataset.act === 'swap') [S.a, S.b] = [S.b, S.a];
      if (b.dataset.act === 'rand') { randomPair(); S.guess = ''; }
      run(); render();
    });
    root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input')) root.querySelector('[data-act="go"]').click(); });
    run(); render();
  }
})(self.WG = self.WG || {});
</script>
<script>
/* Tab: Autocomplete (prefix tree / trie, Unit III). */
(function (WG) {
  const U = WG.ui;
  WG.tabs.push({ id: 'trie', name: 'Autocomplete', unit: 'III', mount });

  function mount(root) {
    const T = WG.T;
    const S = { prefix: 'gr' };
    const letters = WG.WORDS.length * 5;

    function treeSVG(chain) {
      const k = chain.length - 1, last = chain[k];
      const kids = [...last.children.values()].sort((a, b) => b.count - a.count);
      const dx = 96, x0 = 36, rowH = 26;
      const H = Math.max(kids.length * rowH + 30, 150), cy = H / 2;
      const kidX = x0 + (k + 1) * dx + 30, W = kids.length ? kidX + 90 : x0 + k * dx + 90;
      const maxC = Math.max(1, ...kids.map((c) => c.count));
      let s = '';
      chain.forEach((n, i) => { if (i) s += `<line x1="${x0 + (i - 1) * dx}" y1="${cy}" x2="${x0 + i * dx}" y2="${cy}" style="stroke:var(--y);stroke-width:4"/>`; });
      kids.forEach((c, j) => {
        const y = 20 + j * rowH + (H - 30 - kids.length * rowH) / 2 + rowH / 2;
        s += `<line x1="${x0 + k * dx}" y1="${cy}" x2="${kidX}" y2="${y}" style="stroke:var(--line);stroke-width:1.5"/>`;
      });
      chain.forEach((n, i) => {
        const x = x0 + i * dx;
        s += `<circle cx="${x}" cy="${cy}" r="17" style="fill:var(--y)"/><text x="${x}" y="${cy + 5}" text-anchor="middle" style="font:700 15px var(--mono);fill:#fff">${i ? n.letter.toUpperCase() : '•'}</text>`;
        s += `<text x="${x}" y="${cy + 34}" text-anchor="middle" style="font:500 11px var(--mono);fill:var(--muted)">${U.fmt(n.count)}</text>`;
      });
      kids.forEach((c, j) => {
        const y = 20 + j * rowH + (H - 30 - kids.length * rowH) / 2 + rowH / 2, r = 7 + 5 * Math.sqrt(c.count / maxC);
        s += `<g data-letter="${c.letter}" style="cursor:pointer"><title>Add ${c.letter.toUpperCase()}</title><rect x="${kidX - 14}" y="${y - 12}" width="84" height="24" style="fill:transparent"/><circle cx="${kidX}" cy="${y}" r="${r.toFixed(1)}" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5"/>
          <text x="${kidX}" y="${y + 4}" text-anchor="middle" style="font:700 11px var(--mono);fill:var(--ink)">${c.letter.toUpperCase()}</text>
          <text x="${kidX + 20}" y="${y + 4}" style="font:500 11px var(--mono);fill:var(--muted)">${U.fmt(c.count)}${c.word ? ' ✓' : ''}</text></g>`;
      });
      return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:none;display:block" role="img" aria-label="Prefix tree branch for ${U.esc(S.prefix)}">${s}</svg></div>`;
    }

    function render(keepFocus) {
      const chain = T.walk(S.prefix);
      const node = chain ? chain[chain.length - 1] : null;
      const sugg = node ? T.collect(node, 40) : [];
      const right = !chain
        ? `<p class="warn">No word starts with ${S.prefix.toUpperCase()}.</p><p class="dim">The walk from the root stopped: there is no child for the letter ${S.prefix.slice(-1).toUpperCase()}. That dead end is found in O(k) steps for a k-letter prefix.</p>`
        : `<p class="lead">Yellow is the path you typed, one node per letter. The numbers count how many words pass through each node. Grey nodes are the letters that can come next; click one to extend the prefix.</p>
           ${treeSVG(chain)}
           ${node.word ? `<p class="ok">${node.word.toUpperCase()} is a complete word (a leaf at depth 5).</p>` : ''}`;
      root.innerHTML = `<div class="card">
        <h2>Autocomplete</h2>
        ${U.pills([['Prefix tree (trie)', 'III'], ['Tree properties', 'III']])}
        <p class="lead">Phone keyboards store words in a prefix tree. Words that start the same share one path, so typing a few letters jumps straight to every matching word.</p>
        <div class="field"><label class="lbl" for="tr-in">Start typing</label><input id="tr-in" type="text" maxlength="5" value="${S.prefix.toUpperCase()}" autocomplete="off" spellcheck="false"></div>
        <div><div class="big">${node ? U.fmt(node.count) : 0}<small>matching word${node && node.count === 1 ? '' : 's'}</small></div></div>
        <div class="chips">${sugg.map((w) => `<button type="button" class="chip" data-word="${w}">${w}</button>`).join('')}${node && node.count > sugg.length ? `<span class="dim" style="font-size:13px;align-self:center">+${U.fmt(node.count - sugg.length)} more</span>` : ''}</div>
        <div class="stats"><div><b>${U.fmt(letters)}</b><span>Letters in ${U.fmt(WG.WORDS.length)} words</span></div><div><b>${U.fmt(T.nodes - 1)}</b><span>Trie nodes needed (${Math.round((1 - (T.nodes - 1) / letters) * 100)}% saved by shared prefixes)</span></div></div>
        <p class="note">Find a prefix: O(k) for k letters. List m matches: O(m · L). Height of this trie = 5, because every word has 5 letters.</p>
      </div>
      <div class="card"><h2>Prefix tree · ${S.prefix ? S.prefix.toUpperCase() + '…' : 'root'}</h2>${right}</div>`;
      if (keepFocus) { const i = root.querySelector('#tr-in'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    }

    root.addEventListener('input', (e) => { if (e.target.id === 'tr-in') { S.prefix = U.clean(e.target.value); render(true); } });
    root.addEventListener('click', (e) => {
      const w = e.target.closest('[data-word]'); if (w) { S.prefix = w.dataset.word; render(); return; }
      const l = e.target.closest('[data-letter]'); if (l && S.prefix.length < 5) { S.prefix += l.dataset.letter; render(); }
    });
    render();
  }
})(self.WG = self.WG || {});
</script>
<script>
/* Tab: Critical words (cut sets, bridges and connectivity, Units III and IV). */
(function (WG) {
  const U = WG.ui;
  WG.tabs.push({ id: 'critical', name: 'Critical words', unit: 'III/IV', mount });

  function mount(root) {
    const G = WG.G, adj = G.adj;
    const crit = WG.criticalWords(adj);
    const comps = WG.components(adj);
    const cutOf = new Map(crit.cutVertices.map((c) => [c.v, c]));
    const isolated = adj.filter((l) => !l.length).length;
    const largest = Math.max(...comps.sizes);
    const S = { v: crit.cutVertices[0].v, removed: false, msg: '' };

    function ego(v) {
      const r1 = adj[v].slice(0, 22), set1 = new Set(r1), r2 = [], parentOf = new Map();
      for (const u of r1) {
        let k = 0;
        for (const w of adj[u]) {
          if (w === v || set1.has(w) || parentOf.has(w)) continue;
          parentOf.set(w, u); r2.push(w);
          if (++k >= 3 || r2.length >= 36) break;
        }
        if (r2.length >= 36) break;
      }
      return { r1, r2, parentOf, more: adj[v].length - r1.length };
    }

    function svg() {
      const v = S.v, { r1, r2, parentOf, more } = ego(v);
      const cx = 330, cy = 235, R1 = 118, R2 = 200, pos = new Map([[v, [cx, cy]]]);
      const ang = new Map();
      r1.forEach((u, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / Math.max(r1.length, 1); ang.set(u, a); pos.set(u, [cx + R1 * Math.cos(a), cy + R1 * Math.sin(a)]); });
      const byParent = new Map();
      r2.forEach((w) => { const p = parentOf.get(w); if (!byParent.has(p)) byParent.set(p, []); byParent.get(p).push(w); });
      byParent.forEach((list, p) => list.forEach((w, j) => { const a = ang.get(p) + (j - (list.length - 1) / 2) * 0.21; pos.set(w, [cx + R2 * Math.cos(a), cy + R2 * Math.sin(a)]); }));

      let label = null, main = -1, pieces = [];
      if (S.removed) {
        const c = WG.components(adj, v);
        label = c.comp;
        const ids = [...new Set(adj[v].map((u) => c.comp[u]))];
        main = ids.reduce((m, id) => (m < 0 || c.sizes[id] > c.sizes[m] ? id : m), -1);
        pieces = ids.filter((id) => id !== main).map((id) => ({ id, size: c.sizes[id], words: G.words.filter((_, i) => c.comp[i] === id).slice(0, 14) }));
      }
      const colour = (u) => !label ? 'var(--surface)' : label[u] === main ? 'var(--tint)' : 'var(--tint-red)';
      const strokeC = (u) => !label ? 'var(--ink)' : label[u] === main ? 'var(--blue)' : 'var(--red)';

      let s = '';
      const line = (a, b, st) => { const p = pos.get(a), q = pos.get(b); s += `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" style="${st}"/>`; };
      for (let i = 0; i < r1.length; i++) for (let j = i + 1; j < r1.length; j++) if (adj[r1[i]].includes(r1[j])) line(r1[i], r1[j], 'stroke:var(--line);stroke-width:1');
      r2.forEach((w) => line(parentOf.get(w), w, 'stroke:var(--line);stroke-width:1'));
      if (!S.removed) r1.forEach((u) => line(v, u, 'stroke:var(--y);stroke-width:2'));
      const node = (u, r, big) => {
        const [x, y] = pos.get(u);
        s += `<g data-word="${u}" style="cursor:pointer"><title>${G.words[u].toUpperCase()} · degree ${adj[u].length}</title><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" style="fill:${colour(u)};stroke:${strokeC(u)};stroke-width:1.5"/>
          <text x="${x.toFixed(1)}" y="${(y + (big ? 5 : 3.5)).toFixed(1)}" text-anchor="middle" style="font:${big ? 700 : 600} ${big ? 13 : 9.5}px var(--mono);fill:var(--ink);text-transform:uppercase">${G.words[u].toUpperCase()}</text></g>`;
      };
      r2.forEach((w) => node(w, 17));
      r1.forEach((u) => node(u, 20));
      const [x, y] = pos.get(v);
      s += `<circle cx="${x}" cy="${y}" r="30" style="fill:${S.removed ? 'var(--surface)' : 'var(--y)'};stroke:${S.removed ? 'var(--muted)' : 'var(--y)'};stroke-width:2;${S.removed ? 'stroke-dasharray:4 4' : ''}"/>
        <text x="${x}" y="${y + 5}" text-anchor="middle" style="font:800 14px var(--mono);fill:${S.removed ? 'var(--muted)' : '#fff'};${S.removed ? 'text-decoration:line-through' : ''}">${G.words[v].toUpperCase()}</text>`;
      if (more > 0) s += `<text x="${cx}" y="458" text-anchor="middle" style="font:11px var(--mono);fill:var(--muted)">+${more} more neighbours not drawn</text>`;
      return { html: `<div class="scroll"><svg viewBox="0 0 660 466" width="100%" style="min-width:520px;display:block" role="img" aria-label="Neighbourhood of ${G.words[v]}">${s}</svg></div>`, pieces };
    }

    function render() {
      const v = S.v, info = cutOf.get(v), deg = adj[v].length, g = svg();
      const bridgeHere = crit.bridges.filter((b) => b.u === v || b.v === v);
      let verdict;
      if (!deg) verdict = `<p><b>${G.words[v].toUpperCase()}</b> has no one-letter neighbours: it is an isolated vertex, a component on its own.</p>`;
      else if (!info) verdict = `<p><b>${G.words[v].toUpperCase()}</b> is <b>not</b> a cut vertex. Removing it leaves its ${deg} neighbours connected through other words.</p>`;
      else verdict = `<p><b>${G.words[v].toUpperCase()}</b> is a <span class="warn">cut vertex</span>. Removing it splits the network into ${info.pieces} pieces and cuts off ${U.fmt(info.cutOff)} word${info.cutOff === 1 ? '' : 's'}.</p>`;
      if (bridgeHere.length) verdict += `<p>Bridge${bridgeHere.length > 1 ? 's' : ''} at this word: ${bridgeHere.map((b) => `${G.words[b.u].toUpperCase()}–${G.words[b.v].toUpperCase()}`).join(', ')}. Each is a cut set of size one.</p>`;
      const removedText = S.removed ? (g.pieces.length
        ? g.pieces.map((p) => `<p><span class="warn">Cut off (${U.fmt(p.size)}):</span> ${p.words.map((w) => w.toUpperCase()).join(', ')}${p.size > p.words.length ? '…' : ''}</p>`).join('')
        : `<p class="ok">Still connected. Every neighbour can reach the others without ${G.words[v].toUpperCase()}.</p>`) : '';
      root.innerHTML = `<div class="card">
        <h2>Critical words</h2>
        ${U.pills([['Cut sets', 'III'], ['Connectivity', 'IV']])}
        <p class="lead">Words joined by one-letter changes form one big network plus small islands. Some words are the only link between two groups: remove one and the network splits.</p>
        <div class="stats"><div><b>${U.fmt(comps.sizes.length)}</b><span>Connected components</span></div><div><b>${U.fmt(largest)}</b><span>Words in the largest component</span></div>
          <div><b>${U.fmt(isolated)}</b><span>Isolated words (degree 0)</span></div><div><b>${U.fmt(crit.cutVertices.length)} · ${U.fmt(crit.bridges.length)}</b><span>Cut vertices · bridges</span></div></div>
        <div class="field"><label class="lbl" for="cr-in">Inspect any word</label><div class="row"><input id="cr-in" type="text" maxlength="5" list="wordlist" autocomplete="off" placeholder="word"><button class="btn sm" type="button" data-act="look">Show</button></div>${S.msg ? `<p class="warn">${U.esc(S.msg)}</p>` : ''}</div>
        <div><h3 style="margin-bottom:8px">Most critical words</h3><div class="list">${crit.cutVertices.slice(0, 10).map((c) => `<button type="button" data-word="${c.v}" aria-pressed="${c.v === v}">${G.words[c.v]}<span>cuts off ${U.fmt(c.cutOff)}</span></button>`).join('')}</div></div>
        <p class="note">Tarjan's DFS finds every bridge and cut vertex in one pass, O(V + E). A vertex v is a cut vertex when some DFS child's subtree has no back edge above v: low[child] ≥ tin[v].</p>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><h2>${G.words[v].toUpperCase()} <span class="dim" style="font:400 15px var(--body)">degree ${deg}</span></h2>
          <button class="btn ${S.removed ? '' : 'primary'}" type="button" data-act="toggle" ${deg ? '' : 'disabled'}>${S.removed ? 'Put it back' : 'Remove this word'}</button></div>
        ${verdict}${removedText}
        ${deg ? g.html : ''}
        <p class="dim" style="font-size:13px">Yellow: the selected word. After removal, blue neighbours stay in the main network and red ones are cut off. Click any word to inspect it.</p>
      </div>`;
    }

    root.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (a && a.dataset.act === 'toggle') { S.removed = !S.removed; render(); return; }
      if (a && a.dataset.act === 'look') {
        const w = U.clean(root.querySelector('#cr-in').value);
        if (G.index.has(w)) { S.v = G.index.get(w); S.removed = false; S.msg = ''; } else S.msg = `${w.toUpperCase() || 'That'} is not in the word list.`;
        render(); return;
      }
      const n = e.target.closest('[data-word]');
      if (n) { S.v = +n.dataset.word; S.removed = false; S.msg = ''; render(); }
    });
    root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'cr-in') root.querySelector('[data-act="look"]').click(); });
    render();
  }
})(self.WG = self.WG || {});
</script>
<script>
/* Tab: Huffman coding (prefix codes, Unit III). */
(function (WG) {
  const U = WG.ui;
  WG.tabs.push({ id: 'huffman', name: 'Huffman', unit: 'III', mount });

  function mount(root) {
    const H = WG.H, F = WG.FREQ;
    const S = { text: 'graph theory is everywhere', sel: 'e' };
    const total = Object.values(F).reduce((a, b) => a + b, 0);
    const dictBits = Object.entries(F).reduce((s, [c, f]) => s + f * H.codes[c].length, 0);

    // Layout: leaves spaced evenly in left-to-right order, parents centred above children.
    let leaves = 0, depth = 0;
    (function lay(n, d) { n.d = d; depth = Math.max(depth, d); if (n.sym !== undefined) { n.x = leaves++; return; } lay(n.left, d + 1); lay(n.right, d + 1); n.x = (n.left.x + n.right.x) / 2; })(H.root, 0);

    function treeSVG() {
      const SX = 42, SY = 46, W = leaves * SX + 10, Ht = depth * SY + 70;
      const px = (n) => 26 + n.x * SX, py = (n) => 22 + n.d * SY;
      const code = H.codes[S.sel] || '';
      const onPath = new Set();
      let n = H.root; onPath.add(n);
      for (const b of code) { n = b === '0' ? n.left : n.right; onPath.add(n); }
      let e = '', nodes = '';
      (function walk(n) {
        if (n.sym !== undefined) return;
        [[n.left, '0'], [n.right, '1']].forEach(([c, bit]) => {
          const hot = onPath.has(n) && onPath.has(c);
          e += `<line x1="${px(n)}" y1="${py(n)}" x2="${px(c)}" y2="${py(c)}" style="stroke:${hot ? 'var(--blue)' : 'var(--line)'};stroke-width:${hot ? 3 : 1.3}"/>`;
          e += `<text x="${(px(n) + px(c)) / 2 + (bit === '0' ? -7 : 7)}" y="${(py(n) + py(c)) / 2 + 3}" text-anchor="middle" style="font:700 10px var(--mono);fill:${hot ? 'var(--blue)' : 'var(--muted)'}">${bit}</text>`;
          walk(c);
        });
      })(H.root);
      (function draw(n) {
        const hot = onPath.has(n);
        if (n.sym !== undefined) {
          nodes += `<g data-sym="${n.sym}" style="cursor:pointer"><title>${n.sym.toUpperCase()}: ${H.codes[n.sym]}</title><rect x="${px(n) - 15}" y="${py(n) - 15}" width="30" height="30" rx="4" style="fill:${hot ? 'var(--blue)' : 'var(--g)'}"/>
            <text x="${px(n)}" y="${py(n) + 5}" text-anchor="middle" style="font:800 14px var(--mono);fill:#fff">${n.sym.toUpperCase()}</text>
            <text x="${px(n)}" y="${py(n) + 28}" text-anchor="middle" style="font:500 9px var(--mono);fill:var(--muted)">${U.fmt(n.w)}</text></g>`;
          return;
        }
        nodes += `<circle cx="${px(n)}" cy="${py(n)}" r="${hot ? 5 : 4}" style="fill:${hot ? 'var(--blue)' : 'var(--ink)'}"/>`;
        draw(n.left); draw(n.right);
      })(H.root);
      return `<div class="scroll"><svg viewBox="0 0 ${W} ${Ht}" width="${W}" style="max-width:none;display:block" role="img" aria-label="Huffman tree of letter frequencies">${e}${nodes}</svg></div>`;
    }

    function decode(bits) {
      let out = '', n = H.root;
      for (const b of bits) { n = b === '0' ? n.left : n.right; if (n.sym !== undefined) { out += n.sym; n = H.root; } }
      return out;
    }

    function results() {
      const letters = [...S.text.toLowerCase()].filter((c) => c >= 'a' && c <= 'z');
      if (!letters.length) return '<p class="dim">Type some letters to encode.</p>';
      const codes = letters.map((c) => H.codes[c]), bits = codes.join(''), fixed = letters.length * 5;
      return `<div class="stats three"><div><b>${fixed}</b><span>Bits with a fixed 5-bit code</span></div><div><b>${bits.length}</b><span>Bits with Huffman</span></div><div><b>${Math.round((1 - bits.length / fixed) * 100)}%</b><span>Smaller</span></div></div>
        <div><h3 style="margin-bottom:6px">Encoded (one shade per letter)</h3><div class="bits">${codes.map((c, i) => `<i title="${letters[i].toUpperCase()}">${c}</i>`).join('')}</div></div>
        <p>Decoded back from the bits alone: <b style="font-family:var(--mono);text-transform:uppercase">${U.esc(decode(bits))}</b> <span class="ok">✓</span> No separators were needed because no code is the start of another.</p>`;
    }

    function render() {
      const rows = Object.entries(F).sort((a, b) => b[1] - a[1]).map(([c, f]) => `<tr data-sym="${c}" style="cursor:pointer;${c === S.sel ? 'background:var(--tint)' : ''}"><td class="m"><b>${c.toUpperCase()}</b></td><td class="m">${U.fmt(f)}</td><td class="m">${H.codes[c]}</td><td class="m">${H.codes[c].length}</td></tr>`).join('');
      root.innerHTML = `<div class="card">
        <h2>Huffman coding</h2>
        ${U.pills([['Prefix codes', 'III'], ['Huffman tree', 'III']])}
        <p class="lead">Every letter normally costs 5 bits. Huffman gives common letters short codes and rare letters long ones, using how often each letter appears in all ${U.fmt(WG.WORDS.length)} words.</p>
        <div class="field"><label class="lbl" for="hf-in">Type a message</label><textarea id="hf-in" spellcheck="false">${U.esc(S.text)}</textarea></div>
        <div id="hf-out" style="display:grid;gap:12px">${results()}</div>
        <div class="stats"><div><b>${U.fmt(total * 5)}</b><span>Bits to store every letter of the word list at 5 bits each</span></div><div><b>${U.fmt(dictBits)}</b><span>With Huffman (${Math.round((1 - dictBits / (total * 5)) * 100)}% smaller, ${(dictBits / total).toFixed(2)} bits per letter)</span></div></div>
        <p class="note">Build: repeatedly merge the two least frequent nodes, O(n log n) for n = 26 letters. Encode and decode: one tree walk per letter.</p>
      </div>
      <div class="card">
        <h2>The Huffman tree</h2>
        <p class="lead">Each leaf is a letter with its count. Left edges are 0, right edges are 1, so a letter's code is its path from the root. Click a letter to trace it: <b style="font-family:var(--mono)">${S.sel.toUpperCase()} = ${H.codes[S.sel]}</b>.</p>
        ${treeSVG()}
        <div class="scroll" style="max-height:320px;overflow:auto"><table><tr><th>Letter</th><th>Count</th><th>Code</th><th>Bits</th></tr>${rows}</table></div>
      </div>`;
    }

    root.addEventListener('input', (e) => { if (e.target.id === 'hf-in') { S.text = e.target.value; root.querySelector('#hf-out').innerHTML = results(); } });
    root.addEventListener('click', (e) => { const s = e.target.closest('[data-sym]'); if (s) { S.sel = s.dataset.sym; render(); } });
    render();
  }
})(self.WG = self.WG || {});
</script>
<script>
/* Tab: Graph facts (terminology, handshaking lemma, representation, Euler, planarity, colouring bounds; Unit IV). */
(function (WG) {
  const U = WG.ui;
  WG.tabs.push({ id: 'facts', name: 'Graph facts', unit: 'IV', mount });

  function mount(root) {
    const G = WG.G, adj = G.adj, V = adj.length, E = G.edges;
    const deg = adj.map((l) => l.length), sum = deg.reduce((a, b) => a + b, 0);
    const odd = deg.filter((d) => d % 2).length, maxDeg = Math.max(...deg);
    const hubs = G.words.filter((_, i) => deg[i] === maxDeg);
    const comps = WG.components(adj), edgeComps = comps.sizes.filter((s) => s > 1).length;
    let clique = { key: '', words: [] };
    G.buckets.forEach((b, key) => { if (b.length > clique.words.length) clique = { key, words: b.map((i) => G.words[i]) }; });
    const hist = new Array(maxDeg + 1).fill(0); deg.forEach((d) => hist[d]++);
    const S = { word: G.index.has('light') ? 'light' : G.words[deg.indexOf(maxDeg)] };

    function histSVG() {
      const W = 620, H = 180, max = Math.max(...hist), bw = (W - 40) / hist.length;
      let s = '';
      for (let y = 0; y <= 4; y++) { const v = Math.round((max * y) / 4), yy = H - 24 - ((H - 44) * y) / 4; s += `<line x1="34" x2="${W}" y1="${yy}" y2="${yy}" style="stroke:var(--line);stroke-width:1"/><text x="28" y="${yy + 3}" text-anchor="end" style="font:10px var(--mono);fill:var(--muted)">${v}</text>`; }
      hist.forEach((v, d) => {
        const h = ((H - 44) * v) / max, x = 36 + d * bw;
        s += `<rect x="${x.toFixed(1)}" y="${(H - 24 - h).toFixed(1)}" width="${Math.max(bw - 2, 1).toFixed(1)}" height="${h.toFixed(1)}" rx="1" style="fill:${d % 2 ? 'var(--y)' : 'var(--g)'}"><title>degree ${d}: ${v} words</title></rect>`;
        if (d % 2 === 0 || hist.length < 16) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" style="font:10px var(--mono);fill:var(--muted)">${d}</text>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Degree distribution">${s}</svg>`;
    }

    function lookup() {
      const i = G.index.get(S.word);
      if (i === undefined) return `<p class="warn">${U.esc(S.word.toUpperCase()) || 'That'} is not in the word list.</p>`;
      const w = G.words[i], groups = [];
      for (let p = 0; p < 5; p++) {
        const key = w.slice(0, p) + '_' + w.slice(p + 1);
        const others = G.buckets.get(key).filter((j) => j !== i).map((j) => G.words[j]);
        if (others.length) groups.push(`<div><span class="pill">${key.toUpperCase()}</span> <span style="font:13px var(--mono)">${others.map((o) => o.toUpperCase()).join(', ')}</span></div>`);
      }
      return `<p><b style="font-family:var(--mono)">${w.toUpperCase()}</b> has degree <b>${deg[i]}</b>${deg[i] % 2 ? ' (odd)' : ' (even)'}.</p>
        <div style="display:grid;gap:6px">${groups.join('') || '<p class="dim">No neighbours: an isolated vertex.</p>'}</div>
        <p class="dim" style="font-size:13px">This is its adjacency list, grouped by the letter that changes. Each group is a clique: all its words are neighbours of each other too.</p>`;
    }

    function render() {
      const cells = V * V, filled = 2 * E;
      root.innerHTML = `<div class="card">
        <h2>Graph facts</h2>
        ${U.pills([['Terminology & representation', 'IV'], ['Handshaking lemma', 'IV'], ['Euler · planar · colouring', 'IV']])}
        <p class="lead">Live numbers for the whole word graph: ${U.fmt(V)} words as vertices, one-letter changes as edges.</p>
        <div class="stats">
          <div><b>${U.fmt(V)}</b><span>Vertices (words)</span></div><div><b>${U.fmt(E)}</b><span>Edges (one-letter links)</span></div>
          <div><b>${U.fmt(sum)} = 2 × ${U.fmt(E)}</b><span>Handshaking lemma: sum of degrees <span class="ok">✓</span></span></div><div><b>${U.fmt(odd)}</b><span>Odd-degree vertices: always an even number <span class="ok">✓</span></span></div>
          <div><b>${(sum / V).toFixed(2)}</b><span>Average degree</span></div><div><b>${maxDeg}</b><span>Highest degree: ${hubs.slice(0, 3).map((h) => h.toUpperCase()).join(', ')}</span></div>
        </div>
        <p><b>Euler path?</b> <span class="warn">No.</span> ${edgeComps > 1 ? `The edges are spread over ${U.fmt(edgeComps)} separate components, and` : ''} ${U.fmt(odd)} vertices have odd degree. An Euler path needs a connected graph with 0 or 2 odd vertices.</p>
        <p><b>Cliques:</b> words in the bucket <span class="pill">${clique.key.toUpperCase()}</span> (${clique.words.map((w) => w.toUpperCase()).join(', ')}) are all one letter apart, forming K<sub>${clique.words.length}</sub>.</p>
        <p><b>Planar?</b> <span class="warn">No.</span> K<sub>${clique.words.length}</sub> contains K<sub>5</sub>, so by Kuratowski's theorem the graph cannot be drawn without crossings, even though E ≤ 3V − 6 holds (${U.fmt(E)} ≤ ${U.fmt(3 * V - 6)}). That test is necessary, not sufficient.</p>
        <p><b>Colouring bound:</b> the clique needs ${clique.words.length} different colours, so the chromatic number is at least ${clique.words.length}. <b>Bipartite?</b> No: any 3 words in one bucket form a triangle, an odd cycle.</p>
        <p><b>Representation:</b> an adjacency matrix would need ${U.fmt(cells)} cells with only ${U.fmt(filled)} ones (${((filled / cells) * 100).toFixed(2)}% filled). An adjacency list stores just the ${U.fmt(filled)} entries: O(V + E) instead of O(V²).</p>
      </div>
      <div class="card">
        <h2>Degree distribution</h2>
        <p class="lead">How many words have each number of one-letter neighbours. Yellow bars are odd degrees.</p>
        ${histSVG()}
        <div class="field"><label class="lbl" for="gf-in">Look up a word's neighbours</label><div class="row"><input id="gf-in" type="text" maxlength="5" list="wordlist" value="${S.word.toUpperCase()}" autocomplete="off"><button class="btn sm" type="button" data-act="look">Show</button></div></div>
        <div id="gf-out" style="display:grid;gap:10px">${lookup()}</div>
      </div>`;
    }
    root.addEventListener('click', (e) => { const a = e.target.closest('[data-act="look"]'); if (a) { S.word = U.clean(root.querySelector('#gf-in').value); root.querySelector('#gf-out').innerHTML = lookup(); } });
    root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'gf-in') root.querySelector('[data-act="look"]').click(); });
    render();
  }
})(self.WG = self.WG || {});
</script>
<script>WG.start();</script>
